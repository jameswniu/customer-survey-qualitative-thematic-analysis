<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 792" width="900" height="792" role="img" aria-label="Architecture: an Excel file passes through column discovery, question inference, a four-stage analysis engine, and out to three artifacts, with each box coloured by which model owns that step" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bga" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="dota" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#161d26"/></pattern>
  <linearGradient id="nda" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="rla" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3987e5" stop-opacity="0.95"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
  </linearGradient>
  <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6673"/></marker>
  <marker id="arga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/></marker>
  <marker id="aroa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d95926"/></marker>
  <marker id="arba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/></marker>
</defs>
<rect x="0" y="0" width="900" height="792" fill="url(#bga)"/>
<rect x="0" y="0" width="900" height="792" fill="url(#dota)"/>
<text x="36" y="42" fill="#3987e5" font-size="15" font-weight="700" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ARCHITECTURE</text>
<text x="36" y="78" fill="#f3f6f9" font-size="25" font-weight="700">Every stage, and which model owns it</text>
<rect x="36" y="92" width="130" height="2.5" fill="url(#rla)"/>
<rect x="36" y="122" width="224" height="82" fill="#0d141c" stroke="#2a3440" stroke-width="1.2" rx="5"/>
<text x="50" y="143" fill="#5c6773" font-size="12" letter-spacing="1.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">INPUT</text>
<rect x="56" y="148" width="184" height="54" fill="#0d1a16" stroke="#199e70" stroke-width="1.5" rx="4"/>
<text x="148.0" y="171" fill="#35b183" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Excel file</text>
<text x="148.0" y="191" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no schema assumed</text>
<path d="M 148 204 L 148 236" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<rect x="36" y="238" width="420" height="100" fill="#0d141c" stroke="#2a3440" stroke-width="1.2" rx="5"/>
<text x="50" y="259" fill="#5c6773" font-size="12" letter-spacing="1.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">COLUMN DISCOVERY</text>
<rect x="56" y="266" width="180" height="54" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="146.0" y="289" fill="#f3f6f9" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">find ID column</text>
<text x="146.0" y="309" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">by value shape</text>
<rect x="252" y="266" width="184" height="54" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="344.0" y="289" fill="#f3f6f9" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">find question cols</text>
<text x="344.0" y="309" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">free text only</text>
<path d="M 246 338 L 246 372" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<rect x="191.2" y="345.0" width="109.6" height="20" fill="#0c1013" stroke="#2a3440" stroke-width="1" rx="3"/>
<text x="246.0" y="359.0" fill="#7d8896" font-size="12" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">text columns</text>
<rect x="36" y="374" width="420" height="100" fill="#0d141c" stroke="#2a3440" stroke-width="1.2" rx="5"/>
<text x="50" y="395" fill="#5c6773" font-size="12" letter-spacing="1.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">QUESTION INFERENCE</text>
<rect x="56" y="402" width="180" height="54" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="146.0" y="425" fill="#f3f6f9" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sample responses</text>
<text x="146.0" y="445" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">n per column</text>
<rect x="252" y="402" width="184" height="54" fill="#1c1409" stroke="#c9985e" stroke-width="1.5" rx="4"/>
<text x="344.0" y="425" fill="#e0a969" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">infer question</text>
<text x="344.0" y="445" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">temp 0.3</text>
<path d="M 246 474 L 246 508" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<rect x="36" y="510" width="828" height="132" fill="#0d141c" stroke="#2a3440" stroke-width="1.2" rx="5"/>
<text x="50" y="531" fill="#5c6773" font-size="12" letter-spacing="1.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ANALYSIS ENGINE</text>
<rect x="56" y="538" width="178" height="54" fill="#1c1409" stroke="#c9985e" stroke-width="1.5" rx="4"/>
<text x="145.0" y="561" fill="#e0a969" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">theme generation</text>
<text x="145.0" y="581" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3 to 5, temp 0.3</text>
<rect x="250" y="538" width="178" height="54" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="339.0" y="561" fill="#f3f6f9" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">assign everyone</text>
<text x="339.0" y="581" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no orphans</text>
<rect x="444" y="538" width="178" height="54" fill="url(#nda)" stroke="#3a4552" stroke-width="1.5" rx="4"/>
<text x="533.0" y="561" fill="#f3f6f9" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">quote extraction</text>
<text x="533.0" y="581" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ids, then lookup</text>
<rect x="638" y="538" width="178" height="54" fill="#0e1620" stroke="#3987e5" stroke-width="1.5" rx="4"/>
<text x="727.0" y="561" fill="#6fa8ec" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">summary</text>
<text x="727.0" y="581" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GPT-5.1, temp 0.5</text>
<path d="M 234 565 L 248 565" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<path d="M 428 565 L 442 565" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<path d="M 622 565 L 636 565" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<text x="450" y="628" fill="#5c6773" font-size="12.5" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">every participant lands in exactly one theme   |   quotes resolve to source rows   |   no quote reused</text>
<path d="M 190 642 L 190 668" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<rect x="96" y="670" width="188" height="54" fill="#1c130e" stroke="#d95926" stroke-width="1.5" rx="4"/>
<text x="190.0" y="693" fill="#e0763f" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">results.json</text>
<text x="190.0" y="713" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">themes, ids, quotes</text>
<path d="M 450 642 L 450 668" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<rect x="356" y="670" width="188" height="54" fill="#1c130e" stroke="#d95926" stroke-width="1.5" rx="4"/>
<text x="450.0" y="693" fill="#e0763f" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">per-question .xlsx</text>
<text x="450.0" y="713" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one each + combined</text>
<path d="M 710 642 L 710 668" fill="none" stroke="#5a6673" stroke-width="1.7" marker-end="url(#ara)"/>
<rect x="616" y="670" width="188" height="54" fill="#1c130e" stroke="#d95926" stroke-width="1.5" rx="4"/>
<text x="710.0" y="693" fill="#e0763f" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">report.md</text>
<text x="710.0" y="713" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">human layer</text>
<text x="36" y="738" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">Box colour says which model owns the step: amber for Claude Opus, blue for GPT-5.1. Everything grey is deterministic</text>
<text x="36" y="760" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">Python, which is where the three guarantees under the engine are enforced rather than requested.</text>
</svg>
