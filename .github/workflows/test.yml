name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        # No API keys: every test here covers pure logic (parsing, dedup,
        # prompt assembly). If this job ever needs a key, that is a smell.
        run: pytest tests/ -q
      - name: Verify the published figures still match output/results.json
        run: |
          python docs/generate_visuals.py
          git diff --exit-code -- assets docs/figures
